# Publishes the production build as a live demo on GitHub Pages.
#
# One-time setup (repository owner): Settings > Pages > Build and deployment >
# Source: "GitHub Actions". GitHub Pages needs a public repository on the Free plan.
# Run it from the Actions tab ("Run workflow"). To redeploy on every merge, add
#   push:
#     branches: [main]
# under `on:` once Pages is enabled.
name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
